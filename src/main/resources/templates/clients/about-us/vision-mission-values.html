<!DOCTYPE html>
<html lang="en" th:replace="~{clients/index :: dynamic(~{::main})}">
  <head>
    <meta charset="UTF-8" />
    <title>Title</title>
  </head>
  <body>
    <main class="content-wrapper">
      <style>
        .breadcrumb-bg {
          background-image: url([[@{${visionMissionValue.banner_url}}]]);
        }
        .line_img {
          height: 10px;
          background: url([[@{/imgs/stripe-title2.png}]]) repeat-x center center /
            auto 200%;
          flex-grow: 1;
        }
      </style>

      <div class="breadcrumb-area bg_image breadcrumb-bg">
        <div id="brxe-oubmqr" class="brxe-container">
          <div id="brxe-twzaik" class="brxe-block small-text-shadow">
            <div
              id="brxe-naxryb"
              class="brxe-text uni-text-outline-white uni-text-outline"
            >
              <h1 class="split-collab-words">
                [[${ visionMissionValue.getTitle(#locale.language) }]]
              </h1>
            </div>
          </div>
        </div>
      </div>

      <div class="tmp-section-gap about-vmv">
        <div class="container">
          <th:block th:each="visionMission, iter: ${visionMissions}">
            <div class="row">
              <div class="col-lg-12">
                <div class="section-head pb-3">
                  <h4 class="section-sub-title center-title split-collab-words">
                    <img
                            data-sal-delay="200"
                            data-sal="fade"
                            data-sal-duration="800"
                            th:src="@{/imgs/small-icons/section-custom-menubar-blue.png}"
                            alt="Techgel"
                    />
                    <span class="subtitle">[[${ visionMission.getTitle(#locale.language) }]]</span>
                  </h4>

                </div>
              </div>
            </div>
            <div>
              <div th:class="${iter.index%2==0} ? 'vision_info mb-5' : 'mission_info mb-5'" style="overflow: hidden">
                <div
                        th:class="${iter.index%2==0} ? 'justify-content-end row' : 'justify-content-start row'"
                        data-sal-delay="150"
                        data-sal="slide-left"
                        data-sal-duration="800"
                >
                  <div class="col-md-8">
                    <img
                            th:src="@{${visionMission.image_url}}"
                            class="img-fluid"
                            alt=""
                            draggable="false"
                    />
                  </div>
                </div>
                <div class="content_abs">
                  <div
                          class="fs-18 fw-bold text-justify"
                          data-sal-delay="150"
                          data-sal="slide-right"
                          data-sal-duration="800"
                          th:utext="${#strings.replace(visionMission.getContent(#locale.language), '\n', '<br />')}"
                  >
                  </div>
                </div>
              </div>
            </div>
          </th:block>

          <div class="row">
            <div class="col-lg-12">
              <div class="section-head pb-3">
                <h4 class="section-sub-title center-title split-collab-words">
                  <img
                    data-sal-delay="200"
                    data-sal="fade"
                    data-sal-duration="800"
                    th:src="@{/imgs/small-icons/section-custom-menubar-blue.png}"
                    alt="Techgel"
                  />
                  <span class="subtitle">[[${ coreValue.getTitle(#locale.language) }]]</span>
                </h4>
              </div>
            </div>
          </div>
          <div>
            <div class="value_info mb-5" style="overflow: hidden">
              <div class="row">
                <div
                  class="col-md-8"
                  data-sal-delay="300"
                  data-sal="slide-right"
                  data-sal-duration="800"
                >
                  <div class="item_img">
                    <img
                      th:src="@{/imgs/about/technology.webp}"
                      class="img-fluid"
                      alt=""
                      draggable="false"
                    />
                  </div>
                </div>
                <div th:each="coreValueItem: ${coreValueItems}"
                  class="col-md-4"
                  data-sal-delay="300"
                  data-sal="slide-left"
                  data-sal-duration="800"
                >
                  <div class="item_value">
                    <div class="value_inner">
                      <div class="icon_img">
                        <img
                          th:src="@{${coreValueItem.image_url}}"
                          class="img-fluid"
                          alt=""
                          draggable="false"
                        />
                      </div>
                      <h2 class="fs-20 num fw-bold">0[[${ coreValueItem.orderNumber }]]</h2>
                      <h4 class="fs-24 fw-bold text-uppercase">
                        [[${ coreValueItem.getTitle(#locale.language) }]]
                      </h4>
                      <div class="description text-justify">
                        [[${ coreValueItem.getContent(#locale.language) }]]
                      </div>
                    </div>
                  </div>
                </div>

                <div
                  class="col-md-8"
                  data-sal-delay="300"
                  data-sal="slide-left"
                  data-sal-duration="800"
                >
                  <div class="item_img">
                    <img
                      th:src="@{/imgs/people-financial-results-analyzing-statistics.jpg}"
                      class="img-fluid"
                      alt=""
                      draggable="false"
                    />
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
